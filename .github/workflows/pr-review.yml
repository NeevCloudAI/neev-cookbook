name: pr-review

# The pull request review recipe, run on this repository's own pull requests: a model reviews the diff and the
# unit tests of every changed recipe run in a NeevCloud sandbox, never on this runner.
# Uses the same secrets as the nightly workflow.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the review

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a new push replaces the run for the old one

jobs:
  review:
    # Pull requests from forks get no secrets; skip them rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only the recipe is checked out, from the base branch, so a pull request cannot change the script that holds the keys.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: recipes/pr-review-ci-python
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r recipes/pr-review-ci-python/requirements.txt
      # test_changed.sh comes from the pull request and runs in the sandbox, like the rest of its code.
      - run: >-
          python recipes/pr-review-ci-python/review.py
          --test-cmd "bash .github/scripts/test_changed.sh ${{ github.event.pull_request.base.sha }}"
          --allow registry.npmjs.org --allow pypi.org --allow files.pythonhosted.org
        env:
          NEEV_API_KEY: ${{ secrets.NEEV_API_KEY }}
          NEEV_MODEL_API_KEY: ${{ secrets.NEEV_MODEL_API_KEY }}
          NEEV_ORG_ID: ${{ secrets.NEEV_ORG_ID }}
          NEEV_PROJECT_ID: ${{ secrets.NEEV_PROJECT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
