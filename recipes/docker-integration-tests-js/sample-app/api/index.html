<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    :root { --ink: #1e2a3a; --muted: #5b6b7f; --line: #dbe3ee; --accent: #2563eb; --ok: #15803d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
           background: linear-gradient(135deg, #eef4ff, #dfe9fb); display: grid; place-items: center; padding: 32px 16px; }
    main { width: min(560px, 100%); background: #fff; border-radius: 20px; padding: 32px; box-shadow: 0 20px 50px rgba(30, 42, 58, .12); }
    h1 { margin: 0; font-size: 28px; }
    .sub { margin: 4px 0 24px; color: var(--muted); }
    .services { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .svc { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .svc b { display: block; font-size: 14px; }
    .svc span { font-size: 13px; color: var(--ok); }
    .svc span::before { content: "● "; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; font: inherit; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    li small { color: var(--muted); }
    footer { margin-top: 20px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Notes</h1>
  <p class="sub">Running in one NeevCloud sandbox: an API container, Postgres and Redis, started by Docker Compose.</p>
  <div class="services" id="services"></div>
  <form id="add"><input id="text" placeholder="Write a note" required><button>Add</button></form>
  <ul id="notes"></ul>
  <footer>Notes are rows in Postgres; each one is cached in Redis after its first read.</footer>
</main>
<script>
  const services = document.getElementById("services"), list = document.getElementById("notes");
  const svc = (name, detail) => `<div class="svc"><b>${name}</b><span>${detail}</span></div>`;
  const escape = (s) => s.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
  async function load() {
    const status = await (await fetch("/status")).json();
    services.innerHTML = svc("API", `Bun ${status.bun}`) + svc("Postgres", status.postgres) + svc("Redis", status.redis);
    const notes = await (await fetch("/notes")).json();
    list.innerHTML = notes.map((n) => `<li><span>${escape(n.text)}</span><small>#${n.id}</small></li>`).join("") || "<li><small>No notes yet.</small></li>";
  }
  document.getElementById("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("text");
    await fetch("/notes", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: input.value }) });
    input.value = "";
    load();
  });
  load();
</script>
</body>
</html>
